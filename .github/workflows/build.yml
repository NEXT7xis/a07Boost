      - name: Adicionar icone
        run: |
          MAN=$(find . -name AndroidManifest.xml -path "*src/main*" | head -n 1)
          RES=$(dirname "$MAN")/res
          mkdir -p "$RES/mipmap-xxxhdpi"
          echo "" | base64 -d > "$RES/mipmap-xxxhdpi/ic_launcher.png"
          sed -i '0,/<application/s//<application android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' "$MAN"
          grep -n "<application" "$MAN"
