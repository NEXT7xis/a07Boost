name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Criar projeto
        run: |
          set -e
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "A07Boost"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.a07boost"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.a07boost"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF_FILE
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries><package android:name="moe.shizuku.privileged.api" /></queries>
              <application
                  android:label="A07 Boost"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false">
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/a07boost
          cat > app/src/main/java/com/a07boost/MainActivity.kt <<'EOF_FILE'
          package com.a07boost

          import android.app.Activity
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.ViewGroup
          import android.widget.*
          import rikka.shizuku.Shizuku
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private lateinit var log: TextView
              private lateinit var status: TextView
              private lateinit var ram: TextView
              private lateinit var pkgInput: EditText

              private val permListener = Shizuku.OnRequestPermissionResultListener { _, _ -> refresh() }
              private val binderListener = Shizuku.OnBinderReceivedListener { runOnUiThread { refresh() } }
              private val deadListener = Shizuku.OnBinderDeadListener { runOnUiThread { refresh() } }

              private fun ready() = try {
                  Shizuku.pingBinder() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) { false }

              private fun sh(cmd: String): String {
                  return try {
                      val m = Shizuku::class.java.getDeclaredMethod(
                          "newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                      m.isAccessible = true
                      val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                      val out = p.inputStream.bufferedReader().readText()
                      val err = p.errorStream.bufferedReader().readText()
                      p.waitFor()
                      (out + err).trim().ifEmpty { "OK" }
                  } catch (e: Throwable) { "Erro: ${e.message}" }
              }

              private fun run(title: String, vararg cmds: String) {
                  if (!ready()) { append("⚠ Shizuku não está ativo/autorizado."); return }
                  append("▶ $title ...")
                  thread {
                      val res = cmds.joinToString("\n") { sh(it) }
                      runOnUiThread { append("✔ $res"); updateRam() }
                  }
              }

              private fun append(s: String) { log.append(s + "\n\n") }

              private fun refresh() {
                  status.text = when {
                      !try { Shizuku.pingBinder() } catch (e: Throwable) { false } ->
                          "Shizuku: NÃO está rodando.\nAbra o Shizuku e inicie via Depuração por Wi-Fi."
                      Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED -> {
                          Shizuku.requestPermission(1); "Shizuku rodando. Conceda a permissão."
                      }
                      else -> "Shizuku: ATIVO ✔"
                  }
                  updateRam()
              }

              private fun updateRam() {
                  try {
                      val l = java.io.File("/proc/meminfo").readLines()
                      fun kb(k: String) = l.first { it.startsWith(k) }.filter { it.isDigit() }.toLong() / 1024
                      val total = kb("MemTotal"); val av = kb("MemAvailable")
                      ram.text = "RAM livre: $av MB / $total MB"
                  } catch (e: Throwable) { ram.text = "RAM: ?" }
              }

              private fun btn(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label; isAllCaps = false; setOnClickListener { onClick() }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32) }
                  val scroll = ScrollView(this).apply { addView(root) }
                  setContentView(scroll)

                  root.addView(TextView(this).apply { text = "A07 Boost"; textSize = 26f; setTypeface(null, Typeface.BOLD) })
                  status = TextView(this); root.addView(status)
                  ram = TextView(this); root.addView(ram)

                  root.addView(btn("🧹 Limpar cache de todos os apps") {
                      run("Limpando cache", "pm trim-caches 999G")
                  })
                  root.addView(btn("💤 Encerrar apps em segundo plano") {
                      run("Encerrando apps", "am kill-all")
                  })
                  root.addView(btn("⚡ Animações rápidas (0.5x)") {
                      run("Animações 0.5x",
                          "settings put global window_animation_scale 0.5",
                          "settings put global transition_animation_scale 0.5",
                          "settings put global animator_duration_scale 0.5")
                  })
                  root.addView(btn("🔄 Restaurar animações (1x)") {
                      run("Animações 1x",
                          "settings put global window_animation_scale 1.0",
                          "settings put global transition_animation_scale 1.0",
                          "settings put global animator_duration_scale 1.0")
                  })
                  root.addView(btn("🚀 Otimizar apps (speed-profile) — demora") {
